version: "3.8"

services:
  qqbot:
    container_name: qqbot-go
    build:
      context: .
      dockerfile: Dockerfile
    # 如果你以后推镜像到 docker hub，可以改成：
    # image: yourname/qqbot-go:latest
    ports:
      - "8080:8080"        # 根据你的服务监听端口调整
    environment:
      # ---------- 数据库环境变量（根据你的 Go 代码需要修改） ----------
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # 如有其它 env（例如机器人配置）
      # BOT_TOKEN: ${BOT_TOKEN}
      # APP_ID: ${APP_ID}
      # APP_SECRET: ${APP_SECRET}

    volumes:
      # 持久化数据（如不需要可删掉）
      - ./data:/data
      # 持久化日志（可选）
      - ./logs:/var/log/qqbot
    restart: unless-stopped